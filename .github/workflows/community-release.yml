name: Publish verified Community v1.2.2
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/community-release.yml", "config/release.php", "config/updates.php", "docs/releases/v1.2.2.md"]
permissions:
  contents: read
concurrency:
  group: community-release
  cancel-in-progress: false
jobs:
  application-checks:
    uses: ./.github/workflows/quality.yml
  database-backups:
    uses: ./.github/workflows/mysql-update-backup.yml
  release:
    needs: [application-checks, database-backups]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-community-v1.2.2]')))
    environment: community-release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      APP_ENV: testing
      APP_URL: http://localhost
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CANDIDATE_VERSION: '1.2.2'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, zip, gd, bcmath, intl, pdo_sqlite, pdo_mysql
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Require legal review, trusted signing key and live registration
        env:
          LEGAL_READY: ${{ vars.COMMUNITY_LEGAL_REVIEW_APPROVED }}
        run: |
          set -Eeuo pipefail
          test "$LEGAL_READY" = true
          test -f config/release-public.pem
          curl --fail --silent --show-error --max-time 30 https://campaignmanager.ng/api/v2/campaign-manager/deployments/health > "$RUNNER_TEMP/registration-health.json"
          jq -e '.ready == true and .protocol == 1 and .terms_version == "2026-10-12" and .automatic_updates.protocol == 1 and .automatic_updates.ready == true and .automatic_updates.payment_ready == true and .automatic_updates.coverage_protocol == 1 and (.automatic_updates.return_protocols | index(2)) != null and .automatic_updates.coverage_ready == true and .automatic_updates.pricing_source == "campaign_service_prices" and (.automatic_updates.configured_scopes | length) > 0' "$RUNNER_TEMP/registration-health.json"
          if git lfs ls-files | grep ' - '; then echo 'Unresolved LFS assets' >&2; exit 1; fi
      - run: composer install --prefer-dist --no-interaction && composer audit --locked --no-interaction
      - run: npm ci && npm run build && npm audit --omit=dev
      - run: cp .env.example .env && php artisan key:generate --force && php artisan test --log-junit test-results.xml
      - run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction
      - name: Build with established signing identity
        env:
          CAMPAIGN_RELEASE_PRIVATE_KEY: ${{ secrets.CAMPAIGN_RELEASE_PRIVATE_KEY }}
          CAMPAIGN_RELEASE_PRIVATE_KEY_PATH: ${{ runner.temp }}/campaign-release-private.pem
          CAMPAIGN_RELEASE_PUBLIC_KEY_PATH: config/release-public.pem
        run: php scripts/prepare-release.php
      - name: Verify archive and checksums
        run: |
          cd builds/candidate
          test -s release-manifest.json
          test -s campaign-manager.zip
          sha256sum --check campaign-manager.zip.sha256
          unzip -t campaign-manager.zip
          sha256sum --check campaign-manager-updater-bootstrap.zip.sha256
          unzip -t campaign-manager-updater-bootstrap.zip
      # Rehearsal runs with production-only dependencies from the published archives.
      # Exercise the actual bootstrap installer allowlist for every reviewed recent source.
      - name: Rehearse signed bootstrap upgrades from official 1.1.3 through 1.2.1 archives
        run: |
          set -Eeuo pipefail
          for source_version in 1.1.3 1.1.4 1.1.5 1.1.6 1.1.7 1.1.8 1.1.9 1.2.0 1.2.1; do
            source_dir="$RUNNER_TEMP/campaign-upgrade-$source_version"
            mkdir -p "$source_dir/core"
            curl --fail --location --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 180 --silent --show-error "https://github.com/joshualion/Campaign-Manager/releases/download/v$source_version/campaign-manager.zip" -o "$source_dir/campaign-manager.zip"
            curl --fail --location --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 180 --silent --show-error "https://github.com/joshualion/Campaign-Manager/releases/download/v$source_version/campaign-manager.zip.sha256" -o "$source_dir/campaign-manager.zip.sha256"
            (cd "$source_dir" && sha256sum --check campaign-manager.zip.sha256)
            unzip -q "$source_dir/campaign-manager.zip" -d "$source_dir/core"
            mkdir -p "$source_dir/http"
            unzip -q "$source_dir/campaign-manager.zip" -d "$source_dir/http"
            php scripts/verify-bootstrap-http.php "$source_dir/http" "$PWD/builds/candidate/campaign-manager-updater-bootstrap.zip" "$PWD/builds/candidate/bootstrap-http-$source_version-report.json"
            jq -e ' .passed == true and .actual_packaged_bootstrap == true and .authentication_csrf_session_assets == true and .no_upgrade_on_get == true ' "$PWD/builds/candidate/bootstrap-http-$source_version-report.json"
            php scripts/verify-upgrade-bootstrap.php "$source_dir/core" "$PWD/builds/candidate/campaign-manager.zip" "$PWD/builds/candidate/release-manifest.json" "$PWD/builds/candidate/upgrade-$source_version-report.json" "$PWD/builds/candidate/campaign-manager-updater-bootstrap.zip" "$source_version"
            test -s "$PWD/builds/candidate/upgrade-$source_version-report.json"
            jq -e '.state == "completed" and .signed_bootstrap_engine_used == true and .signatures_verified == true and .backup_verified == true and .environment_preserved == true and .existing_users_preserved == true and .existing_uploads_preserved == true' "$PWD/builds/candidate/upgrade-$source_version-report.json"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: community-v1.2.2
          path: |
            builds/candidate/campaign-manager.zip
            builds/candidate/release-manifest.json
            builds/candidate/campaign-manager.zip.sha256
            builds/candidate/campaign-manager-updater-bootstrap.zip
            builds/candidate/campaign-manager-updater-bootstrap.zip.sha256
            builds/candidate/upgrade-*-report.json
            builds/candidate/bootstrap-http-*-report.json
            test-results.xml
          if-no-files-found: error
      - name: Refuse publication from a superseded source commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          current_head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [[ "$current_head" != "$GITHUB_SHA" ]]; then
            echo 'Core main changed after this run started; publish only the newly verified source.' >&2
            exit 1
          fi
      - name: Publish to official public distribution repository
        env:
          GH_TOKEN: ${{ secrets.COMMUNITY_DISTRIBUTION_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          gh release list --repo joshualion/Campaign-Manager --limit 100 --json tagName > "$RUNNER_TEMP/releases.json"
          if jq -e 'any(.[]; .tagName == "v1.2.2")' "$RUNNER_TEMP/releases.json"; then
            echo 'Version exists; asset replacement is prohibited.' >&2
            exit 1
          fi
          gh release create v1.2.2 --repo joshualion/Campaign-Manager --latest --title 'Campaign Manager v1.2.2' --notes-file docs/releases/v1.2.2.md \
            builds/candidate/campaign-manager.zip builds/candidate/release-manifest.json builds/candidate/campaign-manager.zip.sha256 builds/candidate/campaign-manager-updater-bootstrap.zip builds/candidate/campaign-manager-updater-bootstrap.zip.sha256
      - name: Verify anonymously published assets and signatures
        run: |
          set -Eeuo pipefail
          verification_dir="$RUNNER_TEMP/published-verification"
          mkdir -p "$verification_dir"
          cd "$verification_dir"
          release_base="https://github.com/joshualion/Campaign-Manager/releases/download/v$CANDIDATE_VERSION"
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 180 -H 'Cache-Control: no-cache' https://api.github.com/repos/joshualion/Campaign-Manager/releases/latest -o latest-release.json
          jq -e --arg tag "v$CANDIDATE_VERSION" '.tag_name == $tag and .draft == false and .prerelease == false' latest-release.json
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 180 "https://api.github.com/repos/joshualion/Campaign-Manager/releases/tags/v$CANDIDATE_VERSION" -o github-release.json
          for asset in release-manifest.json campaign-manager.zip campaign-manager.zip.sha256 campaign-manager-updater-bootstrap.zip campaign-manager-updater-bootstrap.zip.sha256; do
            curl --fail --silent --show-error --location --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 180 "$release_base/$asset" -o "$asset"
          done
          sha256sum --check campaign-manager.zip.sha256
          sha256sum --check campaign-manager-updater-bootstrap.zip.sha256
          unzip -tq campaign-manager.zip
          unzip -tq campaign-manager-updater-bootstrap.zip
          php "$GITHUB_WORKSPACE/scripts/verify-published-release.php" "$CANDIDATE_VERSION"
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/campaign-release-private.pem"


