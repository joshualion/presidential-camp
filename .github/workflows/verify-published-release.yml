name: Verify published Community release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-published-release.yml'
      - 'scripts/verify-published-release.php'
  workflow_run:
    workflows: ["Publish verified Community v1.2.3"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || contains(github.event.head_commit.message, '[verify-community]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: openssl, zip
          coverage: none
      - name: Download the public stable assets anonymously and verify them
        run: |
          set -euo pipefail
          release_version=1.2.3
          release_base="https://github.com/joshualion/Campaign-Manager/releases/download/v$release_version"
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 180 -H 'Cache-Control: no-cache' "https://api.github.com/repos/joshualion/Campaign-Manager/releases/latest" -o latest-release.json
          jq -e --arg release_tag "v$release_version" '.tag_name == $release_tag and .draft == false and .prerelease == false' latest-release.json
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 180 "https://api.github.com/repos/joshualion/Campaign-Manager/releases/tags/v$release_version" -o github-release.json
          for release_asset in release-manifest.json campaign-manager.zip campaign-manager.zip.sha256 campaign-manager-updater-bootstrap.zip campaign-manager-updater-bootstrap.zip.sha256; do
            curl --fail --silent --show-error --location --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 180 "$release_base/$release_asset" -o "$release_asset"
          done
          sha256sum --check campaign-manager.zip.sha256
          sha256sum --check campaign-manager-updater-bootstrap.zip.sha256
          unzip -tq campaign-manager.zip
          unzip -tq campaign-manager-updater-bootstrap.zip
          php scripts/verify-published-release.php "$release_version"


