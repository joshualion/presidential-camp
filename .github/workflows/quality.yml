name: Application checks
on:
  workflow_dispatch:
  workflow_call:
  pull_request:
  push:
    branches: [main, 'fix/**', 'feat/**']
permissions:
  contents: read
jobs:
  checks:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[prepare-ndc]')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php }}'
          extensions: mbstring, xml, curl, zip, gd, bcmath, intl, pdo_sqlite, pdo_mysql
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer install --prefer-dist --no-interaction
      - name: Lint application, updater, recovery and test PHP
        run: rg --files app config routes tools scripts tests -g '*.php' -0 | xargs -0 -n 1 php -l
      - run: composer audit --locked --no-interaction
      - run: npm ci
      - run: npm run build
      - run: npm audit --omit=dev
      - name: Isolated regression tests
        env:
          APP_ENV: testing
          APP_URL: http://localhost
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan test --log-junit test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-php-${{ matrix.php }}
          path: test-results.xml
