name: Application checks
on:
  workflow_dispatch:
  workflow_call:
  pull_request:
  push:
    branches: [main, 'fix/**', 'feat/**']
permissions:
  contents: read
jobs:
  checks:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[prepare-ndc]')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php }}'
          extensions: mbstring, xml, curl, zip, gd, bcmath, intl, pdo_sqlite, pdo_mysql
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer install --prefer-dist --no-interaction
      - name: Lint application, updater, recovery and test PHP
        run: |
          set -euo pipefail
          find app config routes tools scripts tests -type f -name '*.php' -print0 | xargs -0 -r -n 1 php -l
      - run: composer audit --locked --no-interaction
      - run: npm ci
      - run: npm run build
      - run: npm audit --omit=dev
      - name: Isolated regression tests
        env:
          APP_ENV: testing
          APP_URL: http://localhost
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          V121_BROWSER_OUTPUT: storage/framework/testing/v121-role-editor.html
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan route:list --json > route-list.json
          php artisan view:cache
          find storage/framework/views -type f -name '*.php' -print0 | xargs -0 -r -n 1 php -l
          php artisan view:clear
          php artisan test --log-junit test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-php-${{ matrix.php }}
          path: |
            test-results.xml
            storage/framework/testing/v121-role-editor.html
            public/build/

  database-compatibility:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        database: ['mysql:8.0', 'mariadb:10.11']
    services:
      mysql:
        image: ${{ matrix.database }}
        env:
          MYSQL_ROOT_PASSWORD: synthetic-v120-test-password
          MYSQL_DATABASE: campaign_v120_test
          MYSQL_ROOT_HOST: '%'
        ports: ['3306/tcp']
        options: >-
          --health-cmd="if command -v mysqladmin >/dev/null; then mysqladmin ping -h localhost -psynthetic-v120-test-password; else mariadb-admin ping -h localhost -psynthetic-v120-test-password; fi"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      APP_ENV: testing
      APP_URL: http://localhost
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_DATABASE: campaign_v120_test
      DB_USERNAME: root
      DB_PASSWORD: synthetic-v120-test-password
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, zip, gd, bcmath, intl, pdo_mysql
          tools: composer:v2
          coverage: none
      - run: composer install --prefer-dist --no-interaction
      - name: Authorization, evidence, registration and migration regressions
        env:
          DB_PORT: ${{ job.services.mysql.ports[3306] }}
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan test --filter='IntegratedPermissionsUi|ManagedCampaignCapabilities|IncidentEvidence|ContactConfirmationReturn|V120MigrationCompatibility|MemberImport|LicensedScopeQuery|PollingUnitAgentScope|MemberElectionParticipation' --log-junit database-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v120-database-${{ strategy.job-index }}
          path: database-results.xml

  incident-browser:
    name: Incident evidence browser smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/incident-browser" --no-save --ignore-scripts playwright@1.64.1
          node "$RUNNER_TEMP/incident-browser/node_modules/playwright/cli.js" install --with-deps chromium --only-shell
      - name: Exercise actual evidence preview script in Chromium
        run: PLAYWRIGHT_MODULE="$RUNNER_TEMP/incident-browser/node_modules/playwright/index.mjs" node tests/Browser/incident-evidence-preview.mjs

  permissions-browser:
    name: Integrated permissions brand and responsive browser checks
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: test-results-php-8.3
          path: ${{ runner.temp }}/role-ui
      - name: Install isolated browser runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/role-browser" --no-save --ignore-scripts playwright@1.64.1
          node "$RUNNER_TEMP/role-browser/node_modules/playwright/cli.js" install --with-deps chromium --only-shell
      - name: Verify rendered Blade UI, brand colors, dark mode and independent permissions
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/role-browser/node_modules/playwright/index.mjs
          ROLE_UI_ARTIFACT: ${{ runner.temp }}/role-ui
        run: node tests/Browser/integrated-permissions.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: permissions-browser-previews
          path: storage/framework/testing/permissions-*.png
