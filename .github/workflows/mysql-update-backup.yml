name: MySQL and MariaDB automatic-update backup checks
on:
  push:
    branches: ['fix/coverage-first-updates', main]
    paths:
      - '.github/workflows/mysql-update-backup.yml'
      - 'scripts/verify-mysql-update-backup.php'
      - 'app/Services/Updates/**'
      - 'tools/updater/**'
  pull_request:
    paths:
      - '.github/workflows/mysql-update-backup.yml'
      - 'scripts/verify-mysql-update-backup.php'
      - 'app/Services/Updates/**'
      - 'tools/updater/**'
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  mysql-backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        database: ['mysql:8.0', 'mariadb:10.11', 'mariadb:11.4']
        php: ['8.2', '8.3']
    services:
      mysql:
        image: ${{ matrix.database }}
        env:
          MYSQL_ROOT_PASSWORD: updater-ci-password
          MYSQL_DATABASE: campaign_updater_ci
          MYSQL_ROOT_HOST: '%'
        ports: ['33060:3306']
        options: >-
          --health-cmd="if command -v mysqladmin >/dev/null; then mysqladmin ping -h localhost -pupdater-ci-password; else mariadb-admin ping -h localhost -pupdater-ci-password; fi"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      APP_ENV: testing
      APP_URL: http://localhost
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 33060
      DB_DATABASE: campaign_updater_ci
      DB_USERNAME: root
      DB_PASSWORD: updater-ci-password
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php }}'
          extensions: mbstring, xml, curl, zip, gd, bcmath, intl, pdo_mysql
          tools: composer:v2
          coverage: none
      - name: Install matching native backup and recovery clients
        env:
          DATABASE_IMAGE: ${{ matrix.database }}
        run: |
          sudo apt-get update
          if [[ "$DATABASE_IMAGE" == mariadb:* ]]; then
            sudo apt-get install -y mariadb-client
          else
            sudo apt-get install -y mysql-client
          fi
      - run: composer install --prefer-dist --no-interaction
      - run: cp .env.example .env && php artisan key:generate --force
      - name: Backup, restore, fallback and failure checks
        run: |
          set -euo pipefail
          php scripts/verify-mysql-update-backup.php | tee backup-checks.log
          grep -Fq 'Passed: preserved engines/objects;' backup-checks.log
