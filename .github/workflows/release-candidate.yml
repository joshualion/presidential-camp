name: Prepare private release candidate
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-candidate.yml']
  workflow_dispatch:
    inputs:
      version:
        description: 'Approved candidate version, without v (no automatic bump)'
        required: true
        type: string
permissions:
  contents: read
jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[prepare-candidate]')
    environment: community-release
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      APP_URL: http://localhost
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CANDIDATE_VERSION: "${{ inputs.version || '1.1.4' }}"
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, zip, gd, bcmath, intl, pdo_sqlite, pdo_mysql
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate explicit version
        run: php -r 'if (!preg_match("/^\d+\.\d+\.\d+$/D", getenv("CANDIDATE_VERSION"))) { exit(1); }'
      - run: composer install --prefer-dist --no-interaction
      - run: composer audit --locked --no-interaction
      - run: npm ci && npm run build && npm audit --omit=dev
      - run: cp .env.example .env && php artisan key:generate --force && php artisan test --log-junit test-results.xml
      - name: Install production-only dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction
      - name: Build signed private candidate
        env:
          CAMPAIGN_RELEASE_PRIVATE_KEY: '${{ secrets.CAMPAIGN_RELEASE_PRIVATE_KEY }}'
          CAMPAIGN_RELEASE_PRIVATE_KEY_PATH: '${{ runner.temp }}/campaign-release-private.pem'
          CAMPAIGN_RELEASE_PUBLIC_KEY_PATH: config/release-public.pem
        run: php scripts/prepare-release.php
      - name: Verify signed candidate on an actual isolated v1.1.3 installation
        run: |
          set -Eeuo pipefail
          source_dir="$RUNNER_TEMP/campaign-upgrade-source"
          mkdir -p "$source_dir/core"
          curl --fail --location --retry 3 --silent --show-error https://github.com/joshualion/Campaign-Manager/releases/download/v1.1.3/campaign-manager.zip -o "$source_dir/campaign-manager.zip"
          curl --fail --location --retry 3 --silent --show-error https://github.com/joshualion/Campaign-Manager/releases/download/v1.1.3/campaign-manager.zip.sha256 -o "$source_dir/campaign-manager.zip.sha256"
          (cd "$source_dir" && sha256sum --check campaign-manager.zip.sha256)
          unzip -q "$source_dir/campaign-manager.zip" -d "$source_dir/core"
          php scripts/verify-upgrade-113.php "$source_dir/core" "$PWD/builds/candidate/campaign-manager.zip" "$PWD/builds/candidate/release-manifest.json" "$PWD/builds/candidate/upgrade-113-report.json"
      - uses: actions/upload-artifact@v4
        with:
          name: campaign-manager-candidate-${{ inputs.version || '1.1.4' }}
          path: |
            builds/candidate/campaign-manager.zip
            builds/candidate/release-manifest.json
            builds/candidate/campaign-manager.zip.sha256
            builds/candidate/*-notes.md
            builds/candidate/upgrade-113-report.json
            test-results.xml
          if-no-files-found: error
          retention-days: 14
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/campaign-release-private.pem"
