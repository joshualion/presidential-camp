name: Prepare private release candidate
on:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Approved candidate version, without v (no automatic bump)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application-checks:
    uses: ./.github/workflows/quality.yml
  database-backups:
    uses: ./.github/workflows/mysql-update-backup.yml
  prepare:
    needs: [application-checks, database-backups]
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    environment: community-release
    runs-on: ubuntu-latest
    services:
      fresh-install-db:
        image: mariadb:11.4
        env:
          MYSQL_ROOT_PASSWORD: synthetic-fresh-install-password
          MYSQL_ROOT_HOST: '%'
        ports: ['3306/tcp']
        options: >-
          --health-cmd="mariadb-admin ping -h localhost -psynthetic-fresh-install-password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      APP_ENV: testing
      APP_URL: http://localhost
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CANDIDATE_VERSION: "${{ inputs.version || '1.2.5' }}"
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, zip, gd, bcmath, intl, pdo_sqlite, pdo_mysql
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate explicit version
        run: php -r 'if (!preg_match("/^\d+\.\d+\.\d+$/D", getenv("CANDIDATE_VERSION"))) { exit(1); }'
      - run: composer install --prefer-dist --no-interaction
      - run: composer audit --locked --no-interaction
      - run: npm ci && npm run build && npm audit --omit=dev
      - run: cp .env.example .env && php artisan key:generate --force && php artisan test --log-junit test-results.xml
      - name: Install production-only dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction && composer check-platform-reqs --no-dev
      - name: Build signed private candidate
        env:
          CAMPAIGN_RELEASE_PRIVATE_KEY: '${{ secrets.CAMPAIGN_RELEASE_PRIVATE_KEY }}'
          CAMPAIGN_RELEASE_PRIVATE_KEY_PATH: '${{ runner.temp }}/campaign-release-private.pem'
          CAMPAIGN_RELEASE_PUBLIC_KEY_PATH: config/release-public.pem
        run: php scripts/prepare-release.php
      - name: Rehearse fresh independent-customer House of Representatives installation
        env:
          FRESH_TEST_PORT: ${{ job.services.fresh-install-db.ports[3306] }}
          FRESH_TEST_PASSWORD: synthetic-fresh-install-password
        run: |
          set -Eeuo pipefail
          for scenario in online registration-retry status-outage; do
            export FRESH_TEST_DATABASE="campaign_fresh_${scenario//-/_}"
            php -r '$p=new PDO("mysql:host=127.0.0.1;port=".getenv("FRESH_TEST_PORT"), "root", getenv("FRESH_TEST_PASSWORD")); $p->exec("CREATE DATABASE ".getenv("FRESH_TEST_DATABASE"));'
            fresh_dir="$RUNNER_TEMP/campaign-fresh-$scenario"
            mkdir -p "$fresh_dir"
            unzip -q builds/candidate/campaign-manager.zip -d "$fresh_dir"
            php scripts/verify-fresh-install.php "$fresh_dir" "$scenario" "$PWD/builds/candidate/fresh-$scenario-report.json"
            jq -e '.passed == true and .fresh_empty_database == true and .real_migrations_and_seeders == true and .house_of_representatives_scope == true and .independent_super_admin_login_credentials == true' "builds/candidate/fresh-$scenario-report.json"
          done
      - name: Rehearse signed bootstrap upgrades from official 1.1.3 through 1.2.4 archives
        run: |
          set -Eeuo pipefail
          for source_version in 1.1.3 1.1.4 1.1.5 1.1.6 1.1.7 1.1.8 1.1.9 1.2.0 1.2.1 1.2.2 1.2.3 1.2.4; do
            df -h "$RUNNER_TEMP"
            source_dir="$RUNNER_TEMP/campaign-upgrade-$source_version"
            mkdir -p "$source_dir/core"
            curl --fail --location --retry 3 --silent --show-error "https://github.com/joshualion/Campaign-Manager/releases/download/v$source_version/campaign-manager.zip" -o "$source_dir/campaign-manager.zip"
            curl --fail --location --retry 3 --silent --show-error "https://github.com/joshualion/Campaign-Manager/releases/download/v$source_version/campaign-manager.zip.sha256" -o "$source_dir/campaign-manager.zip.sha256"
            (cd "$source_dir" && sha256sum --check campaign-manager.zip.sha256)
            unzip -q "$source_dir/campaign-manager.zip" -d "$source_dir/core"
            mkdir -p "$source_dir/http"
            unzip -q "$source_dir/campaign-manager.zip" -d "$source_dir/http"
            php scripts/verify-bootstrap-http.php "$source_dir/http" "$PWD/builds/candidate/campaign-manager-updater-bootstrap.zip" "$PWD/builds/candidate/bootstrap-http-$source_version-report.json"
            jq -e ' .passed == true and .actual_packaged_bootstrap == true and .authentication_csrf_session_assets == true and .no_upgrade_on_get == true ' "$PWD/builds/candidate/bootstrap-http-$source_version-report.json"
            php scripts/verify-upgrade-bootstrap.php "$source_dir/core" "$PWD/builds/candidate/campaign-manager.zip" "$PWD/builds/candidate/release-manifest.json" "$PWD/builds/candidate/upgrade-$source_version-report.json" "$PWD/builds/candidate/campaign-manager-updater-bootstrap.zip" "$source_version"
            test -s "$PWD/builds/candidate/upgrade-$source_version-report.json"
            jq -e '.state == "completed" and .signed_bootstrap_engine_used == true and .signatures_verified == true and .backup_verified == true and .environment_preserved == true and .existing_users_preserved == true and .existing_uploads_preserved == true and .enterprise_capabilities_registered == true and .enterprise_infrastructure_initialized == true and .automatic_entitlement_trust == true' "$PWD/builds/candidate/upgrade-$source_version-report.json"
            # Reports are outside this isolated source directory. Do not retain twelve archives, installs and backups on the runner.
            rm -rf "$source_dir"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: campaign-manager-candidate-${{ inputs.version || '1.2.5' }}
          path: |
            builds/candidate/campaign-manager.zip
            builds/candidate/release-manifest.json
            builds/candidate/campaign-manager.zip.sha256
            builds/candidate/*-notes.md
            builds/candidate/upgrade-*-report.json
            builds/candidate/fresh-*-report.json
            builds/candidate/bootstrap-http-*-report.json
            builds/candidate/campaign-manager-updater-bootstrap.zip
            builds/candidate/campaign-manager-updater-bootstrap.zip.sha256
            test-results.xml
          if-no-files-found: error
          retention-days: 14
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/campaign-release-private.pem"



