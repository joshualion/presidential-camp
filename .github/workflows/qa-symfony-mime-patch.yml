name: QA Symfony MIME dependency patch
on:
  push:
    branches: ['qa/enterprise-addons-20261104']
    paths: ['.github/workflows/qa-symfony-mime-patch.yml']
permissions:
  contents: write
jobs:
  patch-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          lfs: true
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
      - name: Upgrade only Symfony MIME and its required dependencies
        run: composer update symfony/mime --with-all-dependencies --no-interaction --no-scripts --prefer-dist
      - name: Verify locked dependency audit
        run: composer audit --locked --no-interaction
      - name: Commit reviewed lockfile candidate to QA branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: patch Symfony MIME advisory in QA lockfile"
          git push origin HEAD:qa/enterprise-addons-20261104
