<!-- MEMBER Distribution By Age Grade -->
<script>
    var barChartCanvas = document.getElementById('barChart').getContext('2d');
    var barChart;

    function updateBarChart() {
        $.ajax({
            url: "{{route($profileData->access_level.'.region.member.distribution.age', $region->uuid)}}", // Update with your route URL
            method: 'GET',
            success: function(data) {
                if (barChart) {
                    barChart.destroy();
                }
                barChart = new Chart(barChartCanvas, {
                    type: 'bar',
                    data: data,
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            y: {
                                beginAtZero: true,
                                title: {
                                    display: true,
                                    text: 'Number of Member'
                                }
                            },
                            x: {
                                title: {
                                    display: true,
                                    text: 'Age Grade'
                                },
                                ticks: {
                                    callback: function(value) {
                                        return value + ' yrs';
                                    }
                                }
                            }
                        },
                        plugins: {
                            legend: {
                                display: false
                            },
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        var label = context.label || '';
                                        if (label) {
                                            label += ': ';
                                        }
                                        if (context.parsed.y !== null) {
                                            label += context.parsed.y + ' Member';
                                        }
                                        return label;
                                    }
                                }
                            }
                        },
                        animation: {
                            duration: 1000,
                            easing: 'easeInOutQuart'
                        },
                        indexAxis: 'y', // This sets the vertical bars

                        // You can add more options as needed
                    }
                });
            }
        });
    }

    // Call the function to initialize the bar chart
    updateBarChart();
</script>
